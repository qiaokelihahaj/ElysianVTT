version: '3.8'
services:
  backend:
    build: 
      context: .
      dockerfile: packages/backend/Dockerfile.dev
    ports:
      # Only the local frontend is published; generic API stays on loopback.
      - "127.0.0.1:5173:5173"
    environment:
      ELYSIAN_ENABLE_DEV_LOGIN: "${ELYSIAN_ENABLE_DEV_LOGIN:-0}"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm --filter @hard-vtt/backend dev"

  frontend:
    build: 
      context: .
      dockerfile: packages/frontend/Dockerfile.dev
    # Share loopback so Vite can proxy to the local-only development API.
    network_mode: "service:backend"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm --filter @hard-vtt/frontend dev --host 0.0.0.0"
    depends_on:
      - backend
